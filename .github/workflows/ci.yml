name: ArchPilot AI CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic dataset
        run: |
          python generate_dataset.py

      - name: Train ML model
        run: |
          python train_model.py

      - name: Check trained model file
        run: |
          test -f archpilot_model.pkl

      - name: Check FastAPI app import
        run: |
          python -c "import app; print('FastAPI app imported successfully')"

      - name: Build Docker image
        run: |
          docker build -t archpilot-ai .